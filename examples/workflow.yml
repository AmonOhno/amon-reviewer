# レビュー対象のリポジトリに .github/workflows/amon-reviewer.yml として置く見本。
# 事前に、対象リポの Secrets に ANTHROPIC_API_KEY を登録しておく。
name: amon-reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # フォークからのPRでは動かさない（Secrets を渡さないため）。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # base ブランチとの差分を取るため、履歴をすべて取得する。
          fetch-depth: 0

      # リリースタグを切るまでは @main を指定する。
      - uses: AmonOhno/amon-reviewer@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          perspective: ui-react
          # 呼び出し元の前提。省略した点は Claude がリポジトリを読んで確認する。
          context: |
            - React 18 / TypeScript
            - テストは Vitest + Testing Library
            - スタイルは CSS Modules とデザイントークン（src/tokens）
            - 共通コンポーネントは forwardRef でネイティブ要素に ref を渡す
